<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NOBLE - Config Free Fire</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Arial, sans-serif;
        }
        body {
            background: #0d0b12;
            color: #fff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
        }
        .container {
            max-width: 420px;
            width: 100%;
            background: #16141e;
            border-radius: 16px;
            padding: 20px;
            border: 1px solid rgba(255,30,39,0.2);
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            position: relative;
            overflow: hidden;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .header h1 {
            font-size: 20px;
            font-weight: 800;
            color: #ff1e27;
            letter-spacing: 1px;
        }
        .status {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 13px;
            font-weight: 700;
            color: #4caf50;
            background: rgba(76, 175, 80, 0.15);
            padding: 4px 12px;
            border-radius: 20px;
            border: 1px solid rgba(76, 175, 80, 0.3);
        }
        .status .dot {
            width: 8px;
            height: 8px;
            background: #4caf50;
            border-radius: 50%;
            animation: pulse-dot 1.5s ease-in-out infinite;
        }
        @keyframes pulse-dot {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.3; transform: scale(0.8); }
        }

        .option {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #0d0b12;
            padding: 10px 14px;
            border-radius: 10px;
            margin-bottom: 8px;
            border: 1px solid #2a2736;
        }
        .option label.option-title {
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            flex-grow: 1;
        }
        .switch {
            position: relative;
            width: 40px;
            height: 22px;
            flex-shrink: 0;
            display: inline-block;
        }
        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }
        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: #2a2736;
            border-radius: 22px;
            transition: .3s;
        }
        .slider:before {
            content: "";
            position: absolute;
            height: 16px;
            width: 16px;
            left: 3px;
            bottom: 3px;
            background: #888;
            border-radius: 50%;
            transition: .3s;
        }
        input:checked + .slider {
            background: #ff1e27;
        }
        input:checked + .slider:before {
            transform: translateX(18px);
            background: #fff;
        }

        /* ÁREA DO JSON */
        .json-area {
            background: #0b0a10;
            border: 1px solid #2a2736;
            border-radius: 10px;
            padding: 12px;
            margin: 16px 0 12px 0;
            display: none;
            max-height: 180px;
            overflow-y: auto;
        }
        .json-area.show {
            display: block;
        }
        .json-area pre {
            font-family: 'Courier New', monospace;
            font-size: 12px;
            color: #aaffaa;
            white-space: pre-wrap;
            word-break: break-all;
            margin: 0;
        }

        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 10px;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
            transition: 0.2s;
        }
        .btn:active {
            transform: scale(0.96);
        }
        .btn-generate {
            background: #ff1e27;
            color: #fff;
            width: 100%;
        }
        .btn-generate:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        .btn-open {
            background: linear-gradient(135deg, #ff6b00, #cc5500);
            color: #fff;
            width: 100%;
        }

        /* OVERLAY DE LOADING */
        .loading-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(13, 11, 18, 0.95);
            backdrop-filter: blur(6px);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 50;
            border-radius: 16px;
            opacity: 0;
            visibility: hidden;
            transition: all 0.4s ease;
        }
        .loading-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid #2a2736;
            border-top: 4px solid #ff1e27;
            border-radius: 50%;
            animation: spin 0.9s linear infinite;
            margin-bottom: 20px;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .loading-text {
            font-size: 18px;
            font-weight: 700;
            letter-spacing: 2px;
            color: #fff;
            animation: pulse 1.2s ease-in-out infinite;
        }
        .loading-text .highlight {
            color: #ff1e27;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .loading-sub {
            margin-top: 10px;
            font-size: 13px;
            color: #888;
            font-weight: 400;
            letter-spacing: 1px;
        }

        .loading-dots::after {
            content: '';
            animation: dots 1.5s steps(4) infinite;
        }
        @keyframes dots {
            0% { content: ''; }
            25% { content: '.'; }
            50% { content: '..'; }
            75% { content: '...'; }
            100% { content: ''; }
        }

        .toast {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: #16141e;
            border: 1px solid #ff1e27;
            color: #fff;
            padding: 8px 18px;
            border-radius: 30px;
            font-size: 13px;
            font-weight: 600;
            opacity: 0;
            visibility: hidden;
            transition: 0.3s;
            white-space: nowrap;
            z-index: 999;
        }
        .toast.show {
            opacity: 1;
            visibility: visible;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>⚡ NOBLE</h1>
        <div class="status">
            <span class="dot"></span> ONLINE
        </div>
    </div>

    <div id="options"></div>

    <div class="json-area" id="jsonArea">
        <pre id="jsonContent"></pre>
    </div>

    <div class="btn-group">
        <button class="btn btn-generate" id="btnGenerate" onclick="iniciarGeracao()">🔥 INJETAR</button>
        <button class="btn btn-open" onclick="abrirFreeFire()">🎮 ABRIR FREE FIRE</button>
    </div>

    <div class="loading-overlay" id="loadingOverlay">
        <div class="spinner"></div>
        <div class="loading-text">
            <span class="highlight">INJETANDO</span><span class="loading-dots"></span>
        </div>
        <div class="loading-sub">Aguarde, processando configurações...</div>
    </div>
</div>

<div class="toast" id="toast">Ação concluída!</div>

<script>
    const funcoes = [
        { id: 'hspescoco', nome: 'HS Pescoço' },
        { id: 'auxilio', nome: 'Auxílio 100%' },
        { id: 'norecoil', nome: 'No Recoil' },
        { id: 'aimtrick', nome: 'AimTrick' },
        { id: 'antilag', nome: 'Anti-Lag' },
        { id: 'ninja', nome: 'Modo Ninja' }
    ];

    const container = document.getElementById('options');
    container.innerHTML = funcoes.map(f => `
        <div class="option">
            <label class="option-title" for="toggle-${f.id}">${f.nome}</label>
            <label class="switch" for="toggle-${f.id}">
                <input type="checkbox" id="toggle-${f.id}">
                <span class="slider"></span>
            </label>
        </div>
    `).join('');

    const overlay = document.getElementById('loadingOverlay');
    const btnGen = document.getElementById('btnGenerate');
    const jsonArea = document.getElementById('jsonArea');
    const jsonContent = document.getElementById('jsonContent');

    function iniciarGeracao() {
        btnGen.disabled = true;
        jsonArea.classList.remove('show');
        overlay.classList.add('active');

        setTimeout(() => {
            const config = { proxy_enabled: true, target: "freefire" };

            if (document.getElementById('toggle-hspescoco').checked) {
                config.target_bone = "neck";
                config.hs_pescoco = 100;
                config.headshot_damage_multiplier = 999;
                config.damage_multiplier = 999;
            }
            if (document.getElementById('toggle-auxilio').checked) {
                config.magnetic_crosshair = true;
                config.aim_lock_strength = "max";
                config.silent_headshot = true;
            }
            if (document.getElementById('toggle-norecoil').checked) {
                config.precisao = 100;
                config.calibracao = 100;
            }
            if (document.getElementById('toggle-aimtrick').checked) {
                config.aim_trick = true;
            }
            if (document.getElementById('toggle-antilag').checked) {
                config.ant_lag = true;
            }
            if (document.getElementById('toggle-ninja').checked) {
                config.ninja_mode = true;
                config.speed_boost = 100;
                config.jump_boost = 50;
            }

            const str = JSON.stringify(config, null, 2);

            jsonContent.textContent = str;
            jsonArea.classList.add('show');
            overlay.classList.remove('active');
            btnGen.disabled = false;

            mostrarToast('JSON gerado com sucesso!');
        }, 2000);
    }

    function abrirFreeFire() {
        const packageName = "com.dts.freefireth";
        const intentUrl = `intent://${packageName}/#Intent;package=${packageName};action=android.intent.action.VIEW;category=android.intent.category.DEFAULT;category=android.intent.category.BROWSABLE;end`;

        const isAndroid = /android/i.test(navigator.userAgent);
        if (isAndroid) {
            const start = Date.now();
            window.location.href = intentUrl;
            setTimeout(() => {
                if (Date.now() - start < 2000) {
                    mostrarToast('Free Fire não encontrado. Instale o jogo.');
                } else {
                    mostrarToast('Abrindo Free Fire...');
                }
            }, 1500);
        } else {
            mostrarToast('Este recurso funciona apenas em dispositivos Android.');
        }
    }

    function mostrarToast(msg) {
        const t = document.getElementById('toast');
        t.textContent = msg;
        t.classList.add('show');
        clearTimeout(t._timer);
        t._timer = setTimeout(() => t.classList.remove('show'), 2500);
    }
</script>
</body>
</html>
